# Application name
spring.application.name=TASKK-SERVICE

#Server port
server.port=8081

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/taskflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging configurations -
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){green} %clr([%X{traceId}]){yellow} %clr([%thread]){blue} %clr(%-5level){cyan} %clr([%X{method} %X{path}]){magenta} %clr([%class{0}.%method]){blue} - %msg%n