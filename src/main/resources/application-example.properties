# Application name
spring.application.name=TASK-SERVICE

#Server port
server.port=8081

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/local_db_name?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=local_username
spring.datasource.password=local_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging configurations -
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){green} %clr([%X{traceId}]){yellow} %clr([%thread]){blue} %clr(%-5level){cyan} %clr([%X{method} %X{path}]){magenta} %clr([%class{0}.%method]){blue} - %msg%n

#SMTP configurations -

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=your-email@gmail.com